services:
  backend:
    environment:
      DATABASE_PROVIDER: Postgres
      DATABASE_SYSTEM_CONNECTION: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-repere};Username=repere_system;Password=repere_system_dev"
      DATABASE_DATA_CONNECTION: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-repere};Username=repere_data;Password=repere_data_dev"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${HOST_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-repere}"
      POSTGRES_USER: "${POSTGRES_SUPERUSER:-repere_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_SUPERUSER_PASSWORD:-repere_dev}"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-repere_admin} -d ${POSTGRES_DB:-repere}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pg-data:
