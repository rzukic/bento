# Postgres override. Layer it on docker-compose.yml or docker-compose.backend-only.yml.
#
# Installs created before the rename to Bento keep their Postgres names: set
# POSTGRES_DB=repere, POSTGRES_SUPERUSER=repere_admin, BENTO_SYSTEM_ROLE=repere_system
# and BENTO_DATA_ROLE=repere_data. The old REPERE_SYSTEM_PASSWORD and
# REPERE_DATA_PASSWORD variables are still read when the BENTO_* ones are unset.
services:
  backend:
    environment:
      DATABASE_PROVIDER: Postgres
      DATABASE_SYSTEM_CONNECTION: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-bento};Username=${BENTO_SYSTEM_ROLE:-bento_system};Password=${BENTO_SYSTEM_PASSWORD:-${REPERE_SYSTEM_PASSWORD:?BENTO_SYSTEM_PASSWORD is required}}"
      DATABASE_DATA_CONNECTION: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-bento};Username=${BENTO_DATA_ROLE:-bento_data};Password=${BENTO_DATA_PASSWORD:-${REPERE_DATA_PASSWORD:?BENTO_DATA_PASSWORD is required}}"
      POSTGRES_SUPERUSER_PASSWORD: "${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-bento}"
      POSTGRES_USER: "${POSTGRES_SUPERUSER:-bento_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD is required}"
      BENTO_SYSTEM_ROLE: "${BENTO_SYSTEM_ROLE:-bento_system}"
      BENTO_DATA_ROLE: "${BENTO_DATA_ROLE:-bento_data}"
      BENTO_SYSTEM_PASSWORD: "${BENTO_SYSTEM_PASSWORD:-${REPERE_SYSTEM_PASSWORD:?BENTO_SYSTEM_PASSWORD is required}}"
      BENTO_DATA_PASSWORD: "${BENTO_DATA_PASSWORD:-${REPERE_DATA_PASSWORD:?BENTO_DATA_PASSWORD is required}}"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-bento_admin} -d ${POSTGRES_DB:-bento}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pg-data:
