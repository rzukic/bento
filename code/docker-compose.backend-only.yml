# API-only packaged deployment (the MVP 1 shape): just the backend, published on
# the host. No proxy, no browser UI. Use this for API-first installs, the
# compose smoke/demo scripts and as the base for docker-compose.dev.yml.
#
#   docker compose -f code/docker-compose.backend-only.yml up --build
#   docker compose -f code/docker-compose.backend-only.yml -f code/docker-compose.postgres.yml up --build
#
# The browser-first full stack lives in docker-compose.yml.
services:
  backend:
    image: repere/backend:local
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_BACKEND_PORT:-5000}:${BACKEND_PORT:-5000}"
    environment:
      AUTH_MODE: "${AUTH_MODE:-standard}"
      JWT_SECRET: "${JWT_SECRET:-}"
      BACKEND_PORT: "${BACKEND_PORT:-5000}"
      DATA_DIR: /data
      LOG_LEVEL: "${LOG_LEVEL:-Information}"
      # Exposed directly, so forwarded headers are never trusted unless configured.
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
    volumes:
      - repere-data:/data
    healthcheck:
      test: ["CMD", "dotnet", "Repere.Api.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  repere-data:
