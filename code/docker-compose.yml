# Full-stack packaged deployment (MVP 2): Caddy proxy + static frontend + backend.
# Only the proxy publishes ports; the browser talks to http://localhost (or DOMAIN).
#
#   docker compose -f code/docker-compose.yml up --build
#   docker compose -f code/docker-compose.yml -f code/docker-compose.postgres.yml up --build
#
# The API-only shape from MVP 1 lives in docker-compose.backend-only.yml.
services:
  proxy:
    image: repere/proxy:local
    build: ./proxy
    restart: unless-stopped
    ports:
      - "${HOST_HTTP_PORT:-80}:80"
      - "${HOST_HTTPS_PORT:-443}:443"
    environment:
      # localhost → plain HTTP on :80. A public hostname → automatic HTTPS.
      DOMAIN: "${DOMAIN:-localhost}"
    volumes:
      # Certificates and Caddy's own state survive restarts.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    image: repere/frontend:local
    build:
      context: ./src/frontend
    restart: unless-stopped
    # No ports: reachable only through the proxy. Health check comes from the image.

  backend:
    image: repere/backend:local
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    restart: unless-stopped
    # No ports: the proxy targets backend:5000 on the compose network.
    environment:
      AUTH_MODE: "${AUTH_MODE:-standard}"
      JWT_SECRET: "${JWT_SECRET:-}"
      BACKEND_PORT: "5000"
      DATA_DIR: /data
      LOG_LEVEL: "${LOG_LEVEL:-Information}"
      # Trust X-Forwarded-* from the compose network the proxy runs on. Must match
      # the subnet below (REPERE_NETWORK_SUBNET) unless you set TRUSTED_PROXIES yourself.
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-172.28.0.0/16}"
    volumes:
      - repere-data:/data
    healthcheck:
      test: ["CMD", "dotnet", "Repere.Api.dll", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

networks:
  # Fixed subnet so the backend can trust the proxy's forwarded headers by range.
  # Override REPERE_NETWORK_SUBNET (and TRUSTED_PROXIES) if it collides with an
  # existing Docker network on this host.
  default:
    ipam:
      config:
        - subnet: "${REPERE_NETWORK_SUBNET:-172.28.0.0/16}"

volumes:
  repere-data:
  caddy-data:
  caddy-config:
