services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: repere
      POSTGRES_USER: repere_admin
      POSTGRES_PASSWORD: repere_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repere_admin -d repere"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
