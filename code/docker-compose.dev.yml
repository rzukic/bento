# Development override: a published backend that accepts the Vite dev server
# origin, plus a throwaway Postgres on 5432. Layer it on the backend-only base;
# the frontend runs from `pnpm run dev` on 5173, not from a container.
#
#   docker compose -f code/docker-compose.backend-only.yml -f code/docker-compose.dev.yml up --build
services:
  backend:
    environment:
      ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: repere
      POSTGRES_USER: repere_admin
      POSTGRES_PASSWORD: repere_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repere_admin -d repere"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
