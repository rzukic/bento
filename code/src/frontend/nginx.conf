# Static file server for the Vite SPA. Installed as /etc/nginx/conf.d/default.conf.
#
# This container only serves files. It knows nothing about the API: there is
# deliberately no location for /api/v1 or /ws, so those paths fall through to the
# SPA fallback below. Routing API traffic to the backend is the Caddy proxy's job
# (code/proxy/Caddyfile); the frontend container is never exposed directly.

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Liveness probe for Docker / compose health checks.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Vite emits content-hashed files under /assets/: safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The entry document is not hashed; browsers must revalidate it so a new
    # deployment is picked up on the next load.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: any path that is not a real file is a React Router route.
    location / {
        try_files $uri /index.html;
    }
}
