name: Tests

on:
  push:
    branches: [main]
    paths:
      - "code/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "code/**"
      - ".github/workflows/test.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: code

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore tests/Repere.Tests/Repere.Tests.csproj

      - name: Build
        run: dotnet build tests/Repere.Tests/Repere.Tests.csproj --no-restore

      - name: Test
        run: dotnet test tests/Repere.Tests/Repere.Tests.csproj --no-build --verbosity normal --filter "Category!=Postgres"

  test-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: code

    env:
      REPERE_TEST_POSTGRES_ADMIN_CONNECTION: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres;Pooling=false

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore tests/Repere.Tests/Repere.Tests.csproj

      - name: Build
        run: dotnet build tests/Repere.Tests/Repere.Tests.csproj --no-restore

      - name: Run Postgres-backed test slice
        run: dotnet test tests/Repere.Tests/Repere.Tests.csproj --no-build --verbosity normal

  test-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: code/src/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: code/src/frontend/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: code/src/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test
