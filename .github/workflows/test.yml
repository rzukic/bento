name: Tests

on:
  push:
    branches: [main]
    paths: ['code/**']
  pull_request:
    paths: ['code/**']

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: code

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/Repere.Tests/Repere.Tests.csproj

      - name: Build
        run: dotnet build tests/Repere.Tests/Repere.Tests.csproj --no-restore

      - name: Test
        run: dotnet test tests/Repere.Tests/Repere.Tests.csproj --no-build --verbosity normal
