name: Deployment Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deployment-validation.yml'
      - 'code/docker-compose.yml'
      - 'code/docker-compose.backend-only.yml'
      - 'code/docker-compose.postgres.yml'
      - 'code/docker-compose.postgres.expose.yml'
      - 'code/.env.example'
      - 'code/.dockerignore'
      - 'code/init-db/**'
      - 'code/proxy/**'
      - 'code/scripts/**'
      - 'code/src/backend/**'
      - 'code/src/frontend/**'
  pull_request:
    paths:
      - '.github/workflows/deployment-validation.yml'
      - 'code/docker-compose.yml'
      - 'code/docker-compose.backend-only.yml'
      - 'code/docker-compose.postgres.yml'
      - 'code/docker-compose.postgres.expose.yml'
      - 'code/.env.example'
      - 'code/.dockerignore'
      - 'code/init-db/**'
      - 'code/proxy/**'
      - 'code/scripts/**'
      - 'code/src/backend/**'
      - 'code/src/frontend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-sqlite:
    name: Backend-only SQLite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Verify deployment toolchain
        run: |
          docker version
          docker compose version
          jq --version

      - name: Run packaged SQLite validation
        run: |
          mkdir -p .artifacts
          code/scripts/packaged-mvp1-demo.sh sqlite \
            --host-backend-port 5001 \
            --project-name gha-demo-sqlite \
            --log-dir .artifacts/packaged-mvp1-sqlite

      - name: Upload SQLite diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-validation-sqlite
          if-no-files-found: ignore
          retention-days: 7
          path: |
            .artifacts/**
            /tmp/repere-smoke-*
            /tmp/repere-demo-*

  deployment-postgres:
    name: Backend-only Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Verify deployment toolchain
        run: |
          docker version
          docker compose version
          jq --version

      - name: Run packaged Postgres validation
        env:
          POSTGRES_SUPERUSER_PASSWORD: gha-postgres-superuser-secret
          REPERE_SYSTEM_PASSWORD: gha-postgres-system-secret
          REPERE_DATA_PASSWORD: gha-postgres-data-secret
        run: |
          mkdir -p .artifacts
          code/scripts/packaged-mvp1-demo.sh postgres \
            --host-backend-port 5002 \
            --project-name gha-demo-postgres \
            --log-dir .artifacts/packaged-mvp1-postgres

      - name: Upload Postgres diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-validation-postgres
          if-no-files-found: ignore
          retention-days: 7
          path: |
            .artifacts/**
            /tmp/repere-smoke-*
            /tmp/repere-demo-*

  deployment-full-stack:
    name: Full stack (proxy + frontend + backend)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: gha-full-stack
      HOST_HTTP_PORT: "8080"
      HOST_HTTPS_PORT: "8443"

    steps:
      - uses: actions/checkout@v4

      - name: Verify deployment toolchain
        run: |
          docker version
          docker compose version
          jq --version

      - name: Build and start the full stack
        run: |
          docker compose -f code/docker-compose.yml --env-file code/.env.example \
            up -d --build --wait --wait-timeout 420

      - name: Verify routing through the proxy
        run: |
          set -euxo pipefail
          base="http://localhost:${HOST_HTTP_PORT}"
          # SPA entry and a deep client route both come back as index.html
          curl -fsS "$base/" | grep -q '<div id="root"'
          curl -fsS "$base/data/customers" | grep -q '<div id="root"'
          # API reaches the backend
          curl -fsS "$base/api/v1/admin/health" | jq -e '.status == "healthy"'
          curl -fsS "$base/api/v1/setup/status" \
            | jq -e '.initialized == false and .database_provider == "sqlite"'
          # Proxy and frontend liveness probes
          curl -fsS "$base/proxy-healthz" | grep -qx ok
          # Only the proxy publishes host ports
          published="$(docker compose -f code/docker-compose.yml --env-file code/.env.example ps --format json \
            | jq -r 'select((.Publishers // []) | map(select(.PublishedPort > 0)) | length > 0) | .Service' \
            | sort -u)"
          test "$published" = "proxy"

      - name: Collect diagnostics
        if: failure()
        run: |
          docker compose -f code/docker-compose.yml --env-file code/.env.example ps
          docker compose -f code/docker-compose.yml --env-file code/.env.example logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: |
          docker compose -f code/docker-compose.yml --env-file code/.env.example down -v --remove-orphans
